
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="icon" type="image/png" href="logo2.png">
    <title>SkillAi's AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Chatbot Container */

        .chat-container {
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 15px;
            overflow: hidden;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);

            display: flex;
            flex-direction: column;
        }

        /* Header */

        .chat-header {
            background: #123456;
            color: white;
            padding: 18px;

            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-icon {
            width: 42px;
            height: 42px;

            background: white;
            color: #123456;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 22px;
        }

        .header-text h3 {
            font-size: 18px;
        }

        .header-text p {
            font-size: 12px;
            margin-top: 3px;
            opacity: 0.8;
        }

        /* Chat Messages */

        .chat-box {
            flex: 1;
            padding: 20px;

            overflow-y: auto;

            background: #f7f9fc;
        }

        .message {
            max-width: 80%;
            padding: 11px 14px;
            margin-bottom: 12px;

            border-radius: 12px;

            font-size: 14px;
            line-height: 1.5;
        }

        /* Bot Message */

        .bot-message {
            background: #e5eaf0;
            color: #222;

            border-bottom-left-radius: 3px;
        }

        /* User Message */

        .user-message {
            background: #123456;
            color: white;

            margin-left: auto;

            border-bottom-right-radius: 3px;
        }

        /* Input Area */

        .input-area {
            padding: 12px;

            border-top: 1px solid #ddd;

            display: flex;
            gap: 8px;

            background: white;
        }

        #userInput {
            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            outline: none;

            font-size: 14px;
        }

        #userInput:focus {
            border-color: #123456;
        }

        #sendButton {
            width: 90px;

            border: none;
            border-radius: 8px;

            background: #123456;
            color: white;

            cursor: pointer;

            font-size: 14px;
        }

        #sendButton:hover {
            background: #0c2945;
        }

        #sendButton:disabled {
            background: #999;
            cursor: not-allowed;
        }

        /* Loading */

        .typing {
            font-style: italic;
            color: #666;
        }

        @media (max-width: 500px) {

            .chat-container {
                width: 95%;
                height: 90vh;
            }

        }
    </style>
</head>


<body>


    <div class="chat-container">


        <!-- Header -->

        <div class="chat-header">

            <div class="bot-icon">
                🤖
            </div>

            <div class="header-text">

                <h3>AI Assistant</h3>

                <p>Online • Ask me anything</p>

            </div>

        </div>


        <!-- Chat Messages -->

        <div class="chat-box" id="chatBox">

            <div class="message bot-message">
                Hello! 👋 Welcome to SkillAi Tech Institute Nankana , How can I help you today?
            </div>

        </div>


        <!-- Input -->

        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Type your question..."
            >

            <button id="sendButton">
                Send
            </button>

        </div>


    </div>



    <script>

        const userInput =
            document.getElementById("userInput");

        const sendButton =
            document.getElementById("sendButton");

        const chatBox =
            document.getElementById("chatBox");


        // YOUR N8N WEBHOOK URL

        const webhookURL =
            "https://skillai2026.app.n8n.cloud/webhook/391e4872-353f-4087-8179-7e559dc061a1";


        // Add message to chat

        function addMessage(message, type) {

            const messageDiv =
                document.createElement("div");

            messageDiv.classList.add(
                "message",
                type === "user"
                    ? "user-message"
                    : "bot-message"
            );

            messageDiv.innerText = message;

            chatBox.appendChild(messageDiv);


            // Scroll to bottom

            chatBox.scrollTop =
                chatBox.scrollHeight;
        }



        // Send message

        async function sendMessage() {

            const query =
                userInput.value.trim();


            // Empty message check

            if (!query) {
                return;
            }


            // Show user message

            addMessage(query, "user");


            // Clear input

            userInput.value = "";


            // Disable button

            sendButton.disabled = true;

            sendButton.innerText = "Sending...";


            // Loading message

            const loadingMessage =
                document.createElement("div");

            loadingMessage.classList.add(
                "message",
                "bot-message",
                "typing"
            );

            loadingMessage.innerText =
                "AI is thinking...";


            chatBox.appendChild(loadingMessage);


            try {


                // Send query to n8n

                const response = await fetch(
                    webhookURL,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            query: query

                        })

                    }
                );


                // Remove loading

                loadingMessage.remove();


                if (!response.ok) {

                    throw new Error(
                        "Request failed"
                    );

                }


                // Get n8n response

                const data =
                    await response.json();


                /*
                    Expected n8n response:

                    {
                        "answer": "This is AI answer"
                    }
                */

console.log(data)
                const answer =
                    data.output;


                // Show AI response

                addMessage(
                    answer ||
                    "Sorry, I didn't get a response.",
                    "bot"
                );


            }

            catch (error) {

                console.error(error);


                loadingMessage.remove();


                addMessage(
                    "❌ Connection failed. Please check your n8n webhook.",
                    "bot"
                );

            }


            // Enable button

            sendButton.disabled = false;

            sendButton.innerText = "Send";


            // Focus input

            userInput.focus();

        }



        // Button click

        sendButton.addEventListener(
            "click",
            sendMessage
        );



        // Enter key

        userInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    sendMessage();

                }

            }
        );

    </script>

</body>

</html>
